version: "3.8" 
services:
  mongodb: 
   container_name: mongocontainer 
   image: mongo:latest 
   ports:
     - "27017:27017"
   networks:
     - mernnetwork
   volumes:
     - mernvolume:/data/db 


  backend: 
   container_name: backendcontainer 
   build: ./mern/backend/ 
   ports:
     - "5050:5050"
   networks: 
     - mernnetwork
   depends_on: 
     - mongodb

  frontend: 
   container_name: frontendcontainer 
   build: ./mern/frontend 
   ports:
     - "5173:5173"
   networks: 
     - mernnetwork




networks:
  mernnetwork:
    driver: bridge



volumes: 
  mernvolume: 

  